[package]
name = "hire"
description = "Capped NEAR treasury for paying an AZZLE poster on Base"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/azzle-lab/near-hire"

# NEP-330 reproducible build. The image digest is the source of truth.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.24.0"
hire-logic = { path = "../hire-logic" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
